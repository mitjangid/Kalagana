name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable, with test deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,tz]"

      - name: Self-test (no pytest required)
        run: python -m kalagana.selftest

      - name: Unit tests (pytest)
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          python -m kalagana day 2024-08-26 --city delhi --format json
          python -m kalagana find Diwali --city delhi --date 2025-01-01
