name: Container

# Builds the Kalagana REST API image and publishes it to the GitHub Container
# Registry, which is what populates the repository's "Packages" section.
# (GitHub Packages does not host Python distributions — those go to PyPI.)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Testing $IMAGE"
          docker run --rm -d --name kalagana-smoke -p 8765:8765 "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then echo; break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8765/day?date=2024-08-26&city=delhi" > /dev/null
          docker stop kalagana-smoke
