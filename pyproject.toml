[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kalagana"
version = "0.1.3"
description = "Official offline Drik Panchang & Panchangam calculator for Python: tithi, nakshatra, muhurat, sunrise/sunset and Hindu, Islamic & national festival dates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amit K. Jangir" }]
keywords = [
    "panchang",
    "panchangam",
    "panchang-calendar",
    "panjika",
    "drik-panchang",
    "hindu-calendar",
    "indian-calendar",
    "hindu-festivals",
    "indian-festivals",
    "festival-calendar",
    "festivals-2026",
    "tithi",
    "nakshatra",
    "muhurat",
    "muhurta",
    "rahu-kalam",
    "choghadiya",
    "ekadashi",
    "diwali",
    "sunrise-sunset",
    "jyotish",
    "vedic-astrology",
    "ephemeris",
    "islamic-calendar",
    "hijri",
    "national-holidays",
    "offline",
    "no-dependencies",
    "standard-library",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Religion",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# On Windows the stdlib zoneinfo needs the IANA tz database supplied separately.
tz = ["tzdata"]
test = ["pytest"]
# Release/packaging tooling (development only; the runtime stays dependency-free).
dev = ["build>=1.2", "twine>=5.0", "pytest>=8.0"]

[project.scripts]
kalagana = "kalagana.cli:main"

[project.urls]
Homepage = "https://github.com/mitjangid/Kalagana"
Repository = "https://github.com/mitjangid/Kalagana"
Documentation = "https://github.com/mitjangid/Kalagana/blob/master/docs/api/README.md"
Issues = "https://github.com/mitjangid/Kalagana/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalagana = ["py.typed"]
